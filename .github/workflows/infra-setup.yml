name: Infra Setup

on:
  workflow_dispatch:
    inputs:
      plan_terraform:
        description: Check to plan Terraform changes
        type: boolean
        default: false
      apply_terraform:
        description: Check to apply Terraform changes
        type: boolean
        default: false
      destroy_terraform:
        description: Check to destroy Terraform-managed infrastructure
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Database settings for the API's .env, read from the repository secrets.
    # Terraform picks up TF_VAR_* as input variables and writes them into the
    # EC2 user data; set at job level because plan, apply and destroy all need them.
    env:
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      # provider.tf sets profile = "default", so the credentials must be written
      # to that profile; exporting them as env vars alone fails on the runner.
      - name: Configure AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: ${{ inputs.plan_terraform }}
        run: terraform plan

      - name: Terraform Apply
        if: ${{ inputs.apply_terraform }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: ${{ inputs.destroy_terraform }}
        run: terraform destroy -auto-approve
